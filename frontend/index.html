<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobalTest — See Your Website From Any Country</title>
    <meta
      name="description"
      content="Free geo website testing: load any URL in a real Chrome browser in the UK, US, Germany, Australia, Ireland, India or Brazil and get a screenshot and load time from each country in seconds."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f8fafc" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlobalTest" />
    <meta property="og:title" content="GlobalTest — See Your Website From Any Country" />
    <meta
      property="og:description"
      content="Load any URL in a real browser in the UK, US, Germany, Australia, Ireland, India or Brazil and compare screenshots and load times side by side."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GlobalTest — See Your Website From Any Country" />
    <meta
      name="twitter:description"
      content="Load any URL in a real browser in the UK, US, Germany, Australia, Ireland, India or Brazil and compare screenshots and load times side by side."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GlobalTest",
        "description": "Test how a website looks and loads from different countries using real Chromium browsers running in each region.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>GlobalTest — see your website from any country</h1>
      <p>
        GlobalTest opens your URL in a real Chromium browser in the United Kingdom, United States, Germany,
        Australia, Ireland, India and Brazil, then shows you a screenshot and load time from each country. Enable JavaScript to run a test.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
